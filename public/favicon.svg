<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fond arrondi avec couleur primaire -->
  <rect width="64" height="64" rx="14" fill="#4F46E5" opacity="0.1"/>
  
  <!-- Téléphone avec liens (représente l'app) -->
  <g>
    <!-- Cadre du téléphone -->
    <rect x="16" y="8" width="32" height="48" rx="4" fill="none" stroke="#4F46E5" stroke-width="2"/>
    
    <!-- Notch du téléphone -->
    <rect x="24" y="8" width="16" height="5" rx="2" fill="#4F46E5" opacity="0.2"/>
    
    <!-- Liens/barres représentant le contenu -->
    <line x1="22" y1="22" x2="42" y2="22" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="32" x2="42" y2="32" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="42" x2="42" y2="42" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Icônes de réseaux sociaux (petits cercles) -->
    <circle cx="28" cy="51" r="2.5" fill="#4F46E5" opacity="0.7"/>
    <circle cx="32" cy="51" r="2.5" fill="#4F46E5" opacity="0.7"/>
    <circle cx="36" cy="51" r="2.5" fill="#4F46E5" opacity="0.7"/>
  </g>
</svg>